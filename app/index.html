<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TV Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg">
  <img id="wall" src="img/wallpaper.jpg" alt="">
  <div id="scene" class="layer"></div>
  <div id="moodbg" class="layer"></div>
  <div id="grad" class="layer"></div>
  <div id="dim" class="layer"></div>
</div>

<div id="page">
  <!-- 1. Home: clock, weather, top icons, tagline, dock -->
  <section id="s-home">
    <div id="dockglow"></div>
    <div id="clockrow"><span id="clock">--:--</span><span id="weather"><svg id="wicon" viewBox="0 0 24 24"></svg><span id="temp"></span></span></div>
    <div id="icons">
      <div class="ic" data-act="wifi"><svg viewBox="0 0 24 24" id="wifiicon"></svg></div>
      <div class="ic" data-act="inputs"><svg viewBox="0 0 24 24"><path d="M10 7l5 5-5 5M15 12H3M14 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5"/></svg></div>
      <div class="ic" data-act="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
    </div>
    <div id="tagline"></div>
    <div id="dock"></div>
  </section>

  <!-- 2. My Favourites -->
  <section id="s-fav">
    <div class="sectitle">My Favourites</div>
    <div id="castglow"></div>
    <div id="lineup"></div>
    <div id="caption"><span id="captitle"></span><span id="capapp"></span></div>
    <canvas id="sense" width="600" height="600"></canvas>
  </section>

  <!-- 3. Don't have time to browse? + More apps -->
  <section id="s-mood">
    <div class="sectitle center">Don't have time to browse?</div>
    <div id="deck"></div>
    <div id="hint"><span class="l">&lsaquo; nope</span><span class="r">yes &rsaquo;</span></div>
    <div id="reel"><div id="reelstrip"></div></div>
    <div id="pick"><div id="picktitle"></div><div id="pickcount"></div><div id="pickbarbg"><div id="pickbar"></div></div></div>
    <div id="morebtn"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg><span>More apps</span></div>
  </section>

  <!-- 4. Play -->
  <section id="s-play">
    <img id="chessposter" src="img/chess/poster.jpg" alt="">
    <div id="chesslabel"><div class="k">Play</div><div class="t">Shadow Chess</div></div>
  </section>
</div>

<div id="inputs" class="menu"></div>

<div id="apps" class="overlay">
  <div class="ovtitle">Apps</div>
  <div id="appgrid"></div>
</div>

<div id="chess" class="overlay">
  <canvas id="board" width="1920" height="1080"></canvas>
</div>

<div id="toast"></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="chess.js"></script>
<script src="app.js"></script>
</body>
</html>
